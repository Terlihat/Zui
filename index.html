<!DOCTYPE html>
<html lang="id" data-theme="dark-default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registrasi Data</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    
    <!-- Link ke file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- VIEW 1: REGISTRASI (Beranda & Database) -->
    <div id="view-registrasi" class="view-section active">
        
        <!-- Tab Bar Sub-Menu -->
        <div class="sub-tab-container">
            <button id="tab-beranda" class="sub-tab active" onclick="switchSubTab('beranda')">Beranda</button>
            <button id="tab-database" class="sub-tab" onclick="switchSubTab('database')">Database</button>
        </div>

        <div class="card-container">
            
            <!-- SUB-VIEW: BERANDA (Form Input) -->
            <div id="sub-beranda" class="sub-view active">
                <h2>Registrasi Data</h2>
                
                <div class="form-group">
                    <label for="nik">NIK</label>
                    <div class="input-group">
                        <div class="input-box">
                            <input type="text" id="nik" placeholder="Masukkan 16 digit angka" oninput="handleInputPintar(this)">
                            <button class="btn-input-action btn-paste" id="btnPaste_nik" onclick="tempelInput('nik')" title="Tempel Clipboard">📋</button>
                            <button class="btn-input-action btn-clear" id="btnClear_nik" onclick="hapusInput('nik')" title="Hapus Teks" style="display: none;">✖</button>
                        </div>
                        <button id="btnVoiceNik" class="btn-voice" onclick="mulaiVoiceInput('nik')" title="Dikte NIK">🎤</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="kk">KK (Opsional)</label>
                    <div class="input-group">
                        <div class="input-box">
                            <input type="text" id="kk" placeholder="Boleh dikosongkan" oninput="handleInputPintar(this)">
                            <button class="btn-input-action btn-paste" id="btnPaste_kk" onclick="tempelInput('kk')" title="Tempel Clipboard">📋</button>
                            <button class="btn-input-action btn-clear" id="btnClear_kk" onclick="hapusInput('kk')" title="Hapus Teks" style="display: none;">✖</button>
                        </div>
                        <button id="btnVoiceKk" class="btn-voice" onclick="mulaiVoiceInput('kk')" title="Dikte KK">🎤</button>
                    </div>
                </div>

                <button class="btn-primary" onclick="tambahData()">Tambah Data</button>
                <button class="btn-secondary" onclick="switchSubTab('database')">Lihat Database ➔</button>
            </div>

            <!-- SUB-VIEW: DATABASE (Pencarian & Tabel) -->
            <div id="sub-database" class="sub-view">
                <button class="btn-back" onclick="switchSubTab('beranda')">🡠 Kembali ke Beranda</button>
                <h2>Database Penduduk</h2>

                <div class="search-container">
                    <div class="input-box">
                        <input type="text" id="searchInput" placeholder="🔍 Cari NIK / KK..." oninput="handleSearchInput(this)">
                        <button class="btn-input-action btn-paste" id="btnPaste_searchInput" onclick="tempelInput('searchInput')" title="Tempel Clipboard">📋</button>
                        <button class="btn-input-action btn-clear" id="btnClear_searchInput" onclick="hapusInput('searchInput')" title="Hapus Pencarian" style="display: none;">✖</button>
                    </div>
                    <button id="btnVoiceSearch" class="btn-voice" onclick="mulaiVoiceSearch()" title="Cari Suara">🎤</button>
                </div>
            </div>
            
        </div>

        <!-- LIST DATA (Hanya tampil di Tab Database) -->
        <div id="data-list-container" style="display: none; margin-top: 15px;">
            <div class="data-list" id="dataContainer">
                <div class="empty-state">Belum ada data tersimpan</div>
            </div>
            <button id="btnLoadMore" class="btn-secondary" style="display: none; margin-top: 15px;" onclick="muatLebihBanyak()">Tampilkan Lebih Banyak ⮟</button>
            <button class="btn-download" id="btnDownload" style="display: none;" onclick="downloadTXT()">Download Semua (TXT)</button>
        </div>
    </div>

    <!-- VIEW 2: NOTE / CATATAN -->
    <div id="view-note" class="view-section">
        <h2>Catatan Bebas</h2>
        <textarea id="catatanInput" class="note-textarea" placeholder="Tulis catatan Anda di sini... (otomatis tersimpan)" oninput="simpanCatatan()"></textarea>
    </div>

    <!-- VIEW 3: TAMPILAN / SETTING -->
    <div id="view-tampilan" class="view-section">
        <h2>Pilih Tema</h2>
        <div class="theme-section-title">MODE GELAP (DARK)</div>
        <div class="theme-item" onclick="pilihTemaItem('dark-default', this)" data-theme-val="dark-default"><span class="theme-dot" style="background-color: #10b981;"></span><span>Default</span></div>
        <div class="theme-item" onclick="pilihTemaItem('dark-ocean', this)" data-theme-val="dark-ocean"><span class="theme-dot" style="background-color: #0ea5e9;"></span><span>Ocean</span></div>
        
        <div class="theme-section-title">MODE TERANG (LIGHT)</div>
        <div class="theme-item" onclick="pilihTemaItem('light-nordic', this)" data-theme-val="light-nordic"><span class="theme-dot" style="background-color: #64748b;"></span><span>Light Nordic</span></div>
        <div class="theme-item" onclick="pilihTemaItem('light-citrus', this)" data-theme-val="light-citrus"><span class="theme-dot" style="background-color: #f59e0b;"></span><span>Light Citrus</span></div>
    </div>

    <!-- BOTTOM NAVBAR -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchView('registrasi', this)">
            <span class="icon">📋</span>
            <span>Registrasi</span>
        </button>
        <button class="nav-item" onclick="switchView('note', this)">
            <span class="icon">📝</span>
            <span>Catatan</span>
        </button>
        <button class="nav-item" onclick="switchView('tampilan', this)">
            <span class="icon">🎨</span>
            <span>Tampilan</span>
        </button>
    </nav>

    <!-- MODAL POPUP KOSTUM -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modalTitle">Informasi</h3>
            <p id="modalMessage">Pesan informasi di sini...</p>
            <div class="modal-actions">
                <button id="modalBtnCancel" class="btn-modal btn-cancel">Batal</button>
                <button id="modalBtnConfirm" class="btn-modal btn-confirm">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- Link ke file JS eksternal -->
    <script src="script.js"></script>
</body>
</html>
